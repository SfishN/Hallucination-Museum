<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Hallucination Museum</title>

  <link
    rel="stylesheet"
    href="style.css"
  />
</head>

<body>

  <main>

    
    <h1>
      Hallucination Museum
    </h1>

    <p class="intro">
      Upload an image and observe how it mutates
      through repeated cycles of description and
      regeneration. Each submission becomes a
      separate exhibition hall containing five
      stages of hallucination.
    </p>

    <section class="control-panel">

      <input
        type="file"
        id="imageInput"
        accept="image/*"
      />

      <select
        id="hallucinationLevel"
      >
        <option value="low">
          Low Hallucination
        </option>

        <option
          value="medium"
          selected
        >
          Medium Hallucination
        </option>

        <option value="high">
          High Hallucination
        </option>
      </select>

      <button
        id="startButton"
      >
        Start Iteration
      </button>

    </section>

    <section
      id="previewSection"
      class="preview-section"
    >

      <h2>
        Original Image
      </h2>

      <img
        id="originalImage"
        alt="Uploaded image preview"
      />

    </section>

    <section>

      <h2>
        Special Exhibition
      </h2>

      <a href="special.html">

        Enter Exhibition

      </a>

    </section>

    <section
      class="museum-section"
    >

      <h2>
        Museum Archive
      </h2>

      <div
        id="museumGrid"
        class="museum-grid"
      >
      </div>

    </section>
    

  </main>

  <script src="script.js"></script>

</body>
</html>
